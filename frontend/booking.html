<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookings — CarRental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/booking.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="site-nav">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
      <div class="site-logo">CarRental</div>
      <div id="navLinks" class="flex items-center gap-4"></div>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold mb-6">My Bookings</h1>
    <div id="bookingList" class="flex flex-wrap gap-6"></div>
  </main>

  <footer class="site-footer">
    <div class="container mx-auto px-6 text-center text-sm">© CarRental</div>
  </footer>

  <div id="toast" class="fixed bottom-5 right-5 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 translate-y-5 transition-all duration-300 ease-in-out z-50">
    Success
  </div>

  <script>
    async function updateNavbar() {
      const navLinks = document.getElementById("navLinks");
      const token = localStorage.getItem("token");
      if (!navLinks) return;
      if (!token) { navLinks.innerHTML = '<a class="nav-link" href="login.html">Login</a><a class="nav-link" href="signup.html">Signup</a>'; return; }
      try {
        const res = await fetch("http://localhost:5000/api/auth/me", { headers: { Authorization: "Bearer " + token }});
        const user = await res.json();
        if (res.ok) {
          let extra = user.isAdmin ? '<a class="nav-link" href="admin.html">Admin</a>' : '<a class="nav-link" href="booking.html" class="font-semibold">My Bookings</a>';
          navLinks.innerHTML = extra + '<button onclick="logout()" class="ml-3 text-sm text-red-600">Logout</button>';
        } else { localStorage.removeItem("token"); navLinks.innerHTML = '<a class="nav-link" href="login.html">Login</a>'; }
      } catch { navLinks.innerHTML = '<a class="nav-link" href="login.html">Login</a>'; }
    }
    function logout(){ localStorage.removeItem('token'); window.location.href='login.html'; }
    updateNavbar();
  </script>
  <body class="min-h-screen" style="
  background: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.8)),
    url('https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=1600&q=80');
  background-size: cover;
  background-attachment: fixed;
  background-position: center;
  color: #f8fafc;">

</body>
</html>
