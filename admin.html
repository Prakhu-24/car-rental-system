<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — CarRental</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- NAVBAR -->
  <header class="site-nav">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <div class="site-logo">🚗 CarRental — Admin</div>
      <div id="navLinks" class="flex items-center gap-4 text-sm"></div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold mb-8 text-teal-400 text-center">Admin Dashboard</h1>

    <div class="grid md:grid-cols-2 gap-8">
      <!-- Add Car Section -->
      <div class="card backdrop-blur-md bg-white/10 border border-white/20">
        <h2 class="text-xl font-semibold mb-4 text-teal-400">Add New Car</h2>

        <input id="name" class="w-full p-3 mb-3 rounded text-white bg-white/20 border border-white/30" placeholder="Car Name">
        <input id="brand" class="w-full p-3 mb-3 rounded text-white bg-white/20 border border-white/30" placeholder="Brand">
        <input id="pricePerDay" type="number" class="w-full p-3 mb-3 rounded text-white bg-white/20 border border-white/30" placeholder="Price per Day">
        <input id="imageUrl" class="w-full p-3 mb-4 rounded text-white bg-white/20 border border-white/30" placeholder="Image URL">

        <button onclick="addCar()" class="btn-primary w-full">Add Car</button>
      </div>

      <!-- Manage Cars Section -->
      <div class="card backdrop-blur-md bg-white/10 border border-white/20">
        <h2 class="text-xl font-semibold mb-4 text-teal-400">Manage Cars</h2>
        <div id="carAdminList" class="space-y-3">
          <p class="text-gray-300 text-sm">Fetching cars...</p>
        </div>
      </div>
    </div>

    <!-- All Bookings Section -->
    <div class="card backdrop-blur-md bg-white/10 border border-white/20 mt-10">
      <h2 class="text-xl font-semibold mb-4 text-teal-400">All Bookings</h2>
      <div id="bookingAdminList" class="space-y-3">
        <p class="text-gray-300 text-sm">Loading bookings...</p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© 2025 CarRental Admin Dashboard</p>
  </footer>

  <!-- TOAST -->
  <div id="toast"
       class="fixed bottom-5 right-5 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 translate-y-5 transition-all duration-300 ease-in-out z-50">
    Success
  </div>

  <!-- ADMIN SCRIPT -->
  <script>
    const API_URL = "http://localhost:5000/api";

    async function updateNavbar() {
      const navLinks = document.getElementById("navLinks");
      const token = localStorage.getItem("token");
      if (!token) {
        navLinks.innerHTML = '<a class="nav-link" href="login.html">Login</a>';
        return;
      }
      try {
        const res = await fetch(API_URL + "/auth/me", {
          headers: { Authorization: "Bearer " + token },
        });
        const user = await res.json();
        if (res.ok && user.isAdmin) {
          navLinks.innerHTML =
            '<a class="nav-link" href="index.html">Home</a><button onclick="logout()" class="ml-3 text-sm text-red-400 hover:text-red-300">Logout</button>';
        } else {
          localStorage.removeItem("token");
          window.location.href = "index.html";
        }
      } catch {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    // 🧾 Load cars
    async function loadCars() {
      const res = await fetch(API_URL + "/cars");
      const cars = await res.json();
      const list = document.getElementById("carAdminList");
      list.innerHTML = "";
      if (!cars.length) {
        list.innerHTML = '<p class="text-gray-400">No cars added yet.</p>';
        return;
      }
      cars.forEach((car) => {
        const div = document.createElement("div");
        div.className = "flex items-center justify-between bg-white/10 p-3 rounded";
        div.innerHTML = `
          <div>
            <p class="font-semibold text-white">${car.brand} ${car.name}</p>
            <p class="text-sm text-gray-300">₹${car.pricePerDay}/day</p>
          </div>
          <button onclick="deleteCar('${car._id}')" class="text-red-400 hover:text-red-500 text-sm">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    // 🚘 Add Car
    async function addCar() {
      const token = localStorage.getItem("token");
      const name = document.getElementById("name").value.trim();
      const brand = document.getElementById("brand").value.trim();
      const pricePerDay = document.getElementById("pricePerDay").value.trim();
      const imageUrl = document.getElementById("imageUrl").value.trim();

      if (!name || !brand || !pricePerDay || !imageUrl) {
        showToast("All fields required!", "error");
        return;
      }

      const res = await fetch(API_URL + "/cars/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body: JSON.stringify({ name, brand, pricePerDay, imageUrl }),
      });

      const data = await res.json();
      if (res.ok) {
        showToast("Car added!");
        loadCars();
      } else {
        showToast(data.message || "Failed to add car", "error");
      }
    }

    // ❌ Delete Car
    async function deleteCar(id) {
      const token = localStorage.getItem("token");
      if (!confirm("Delete this car?")) return;

      const res = await fetch(API_URL + "/cars/" + id, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token },
      });

      const data = await res.json();
      if (res.ok) {
        showToast("Car deleted!");
        loadCars();
      } else {
        showToast(data.message || "Failed to delete", "error");
      }
    }

    // 📊 Load All Bookings
    async function loadBookings() {
      const token = localStorage.getItem("token");
      const res = await fetch(API_URL + "/bookings/all", {
        headers: { Authorization: "Bearer " + token },
      });

      const data = await res.json();
      const container = document.getElementById("bookingAdminList");
      container.innerHTML = "";

      if (!data.length) {
        container.innerHTML = '<p class="text-gray-400">No bookings yet.</p>';
        return;
      }

      data.forEach((b) => {
        const div = document.createElement("div");
        div.className = "bg-white/10 p-3 rounded border border-white/10";
        div.innerHTML = `
          <p class="text-sm text-gray-300 mb-1"><strong>User:</strong> ${b.user?.name || "N/A"} (${b.user?.email || "N/A"})</p>
          <p class="text-sm text-gray-300 mb-1"><strong>Car:</strong> ${b.car?.brand || ""} ${b.car?.name || ""}</p>
          <p class="text-sm text-gray-300 mb-1"><strong>Total:</strong> ₹${b.totalAmount}</p>
          <p class="text-sm text-gray-300 mb-1"><strong>Duration:</strong> ${new Date(b.startDate).toLocaleDateString()} → ${new Date(b.endDate).toLocaleDateString()}</p>
          <p class="text-sm text-gray-400"><strong>Status:</strong> ${b.status}</p>
        `;
        container.appendChild(div);
      });
    }

    // 🔁 Auto-refresh bookings every 10s
    setInterval(loadBookings, 10000);

    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("opacity-0", "translate-y-5");
      toast.classList.remove("bg-green-500", "bg-red-500");
      toast.classList.add(type === "error" ? "bg-red-500" : "bg-green-500");
      setTimeout(() => toast.classList.add("opacity-100", "translate-y-0"), 10);
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-5");
      }, 2500);
    }

    updateNavbar();
    loadCars();
    loadBookings();
  </script>
</body>
</html>
